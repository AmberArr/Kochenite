product: android/app

dependencies:
  - //proof-ui

settings:
  android:
    namespace: moe.frost.kochenite.proof.release
    # The permanent release ID is reserved for the durable signing key after the gate.
    applicationId: moe.frost.kochenite.debug.releaseproof
    minSdk: 26
    compileSdk: 36
    targetSdk: 36
    versionName: temporary-proof
    signing:
      enabled: true
      propertiesFile: ../.local/proof-signing/keystore.properties
  jvm:
    jdk:
      version: 21
